# XcodeGen spec for the iPad app. Generate the project with:
#   brew install xcodegen && cd App && xcodegen generate && open KingdomOfNumbers.xcodeproj
name: KingdomOfNumbers
options:
  bundleIdPrefix: com.nigam.kingdom
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
# Signing team: kept out of the repo (it is public) and out of project.yml, so `xcodegen generate` never wipes it.
# Signing.xcconfig includes App/Local.xcconfig (gitignored) when it exists; put DEVELOPMENT_TEAM = <team id> there.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  KingdomCore:
    path: ..
targets:
  KingdomOfNumbers:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # App icon (#29, "Building blocks", picked by Shrikant 2026-11-02). Source: Resources/app-icon-source.svg.
      - path: Resources/Assets.xcassets
    dependencies:
      - package: KingdomCore
    preBuildScripts:
      # Stops a build from a project that was generated before a source file was added
      # (Xcode then says "Cannot find 'X' in scope"). The fix is always: cd App && xcodegen generate.
      - name: Check the Xcode project lists every source file
        basedOnDependencyAnalysis: false
        script: |
          missing=""
          for f in "$SRCROOT"/Sources/*.swift; do
            n=$(basename "$f")
            grep -q "$n" "$PROJECT_FILE_PATH/project.pbxproj" || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "error: The Xcode project is out of date. Missing:$missing. In Terminal run: cd App && xcodegen generate, then build again."
            exit 1
          fi
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.nigam.kingdom.KingdomOfNumbers
        PRODUCT_NAME: Kingdom of Numbers
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Home School
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        CODE_SIGN_STYLE: Automatic
  KingdomOfNumbersQA:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QATests
    dependencies:
      - target: KingdomOfNumbers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nigam.kingdom.QA
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TEST_TARGET_NAME: KingdomOfNumbers
schemes:
  KingdomOfNumbers:
    build:
      targets:
        KingdomOfNumbers: all
        KingdomOfNumbersQA: [test]
    test:
      targets:
        - KingdomOfNumbersQA
      gatherCoverageData: false
    run:
      config: Debug
      # Shrikant, 2026-11-03: under Xcode's debugger on his iPad (iPadOS 26) the app aborts in system code before
      # any app code runs ("-[OS_dispatch_mach_msg _setContext:]: unrecognized selector", 3.6 MB, no app frames),
      # while the same build opened from its icon works. Run installs and launches without attaching the debugger,
      # so it behaves like tapping the icon. To debug, tick Edit Scheme > Run > Info > Debug executable.
      debugEnabled: false
